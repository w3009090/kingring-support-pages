name: Publish plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build installable plugin archive
        run: |
          mkdir -p release/kingring-support-pages
          cp -R assets templates kingring-support-pages.php README.md release/kingring-support-pages/
          cd release
          zip -r ../CodexPlugin.zip kingring-support-pages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CodexPlugin.zip --title "$GITHUB_REF_NAME" --generate-notes
